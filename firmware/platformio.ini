; Smart Alarm — ESP32 firmware (Phase 4)
; Build env for an ESP32 dev board + 3.2" ILI9341 320x240 SPI TFT.
;
; TFT_eSPI is configured entirely through build_flags here (USER_SETUP_LOADED),
; so you never edit files inside .pio/libdeps. Change the pin numbers below to
; match how YOU wire the panel — nothing else in the code needs to change.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; All fonts are embedded in the firmware (src/NotoSansBold*.h, src/ClockFont.h) —
; no filesystem upload needed. OTA-friendly layout: two ~1.9MB app slots + a small
; (~190KB) filesystem (currently unused). NOTE: changing the partition table
; itself requires one USB flash (and the device re-pairs).
board_build.partitions = min_spiffs.csv

; Faster, smaller build; keep exceptions off to save flash.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	; 0 for release builds: level 3 embeds many debug strings in flash.
	-DCORE_DEBUG_LEVEL=0

	; ---- TFT_eSPI panel config (ILI9341, SPI) -------------------------------
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	; IPS panel (the board is labelled "use IPS code, not TN"): IPS inverts the
	; colour logic vs TN, so without this blacks look white and colours are wrong.
	-DTFT_INVERSION_ON=1
	; SPI pins (classic TFT_eSPI ESP32 defaults — rewire-friendly):
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=4
	; Fonts: we render only anti-aliased VLW (SMOOTH_FONT), all baked into src/
	; (NotoSansBold15/36 + ClockFont). GLCD (font 1) is kept as the library's
	; default face; the other bitmap/GFX fonts are unused, so they're left out.
	-DLOAD_GLCD=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000
	-DTOUCH_CS=255

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.1.0
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/tzapu/WiFiManager.git#v2.0.17
