; Smart Alarm — ESP32 firmware (Phase 4)
; Build env for an ESP32 dev board + 3.2" ILI9341 320x240 SPI TFT.
;
; TFT_eSPI is configured entirely through build_flags here (USER_SETUP_LOADED),
; so you never edit files inside .pio/libdeps. Change the pin numbers below to
; match how YOU wire the panel — nothing else in the code needs to change.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600

; Faster, smaller build; keep exceptions off to save flash.
build_unflags = -std=gnu++11
build_flags =
	-std=gnu++17
	-DCORE_DEBUG_LEVEL=3

	; ---- TFT_eSPI panel config (ILI9341, SPI) -------------------------------
	-DUSER_SETUP_LOADED=1
	-DILI9341_DRIVER=1
	-DTFT_WIDTH=240
	-DTFT_HEIGHT=320
	; SPI pins (classic TFT_eSPI ESP32 defaults — rewire-friendly):
	-DTFT_MISO=19
	-DTFT_MOSI=23
	-DTFT_SCLK=18
	-DTFT_CS=15
	-DTFT_DC=2
	-DTFT_RST=4
	; Fonts bundled into the build:
	-DLOAD_GLCD=1
	-DLOAD_FONT2=1
	-DLOAD_FONT4=1
	-DLOAD_FONT6=1
	-DLOAD_FONT7=1
	-DLOAD_GFXFF=1
	-DSMOOTH_FONT=1
	-DSPI_FREQUENCY=40000000
	-DSPI_READ_FREQUENCY=20000000

lib_deps =
	bodmer/TFT_eSPI@^2.5.43
	bodmer/TJpg_Decoder@^1.1.0
	bblanchon/ArduinoJson@^7.2.0
	https://github.com/tzapu/WiFiManager.git#v2.0.17
